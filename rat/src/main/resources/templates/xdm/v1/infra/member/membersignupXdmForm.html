<!-- Login box start -->
<body class="login-container">
	<div class="container">
		<form id="form" name="form" method="post"
			action="/xdm/v1/infra/member/membersignupXdmForm">
			<div class="login-box rounded-2 p-5">
				<div class="login-form">
					<a href="/xdm/v1/infra/member/membersignupXdmForm"
						class="login-logo mb-3"> <img src="/xdm/v1/images/logo.svg"
						alt="Crowdnub Admin" />
					</a>
					<h5 class="fw-light mb-5">회원가입</h5>
					<div class="mb-3">
						<label class="form-label">아이디</label> <input type="text"
							id="memberId" name="memberId" th:value="${item?.memberId}"
							class="form-control" placeholder="아이디를 입력해주세요" autocomplete="off" />
					</div>
					<div class="mb-3">
						<label class="form-label">비밀번호</label> <input type="password"
							id="memberPw" name="memberPw" class="form-control"
							placeholder="비밀번호를 입력해주세요" />
					</div>
					<!-- 					<div class="mb-3"> -->
					<!-- 						<label class="form-label">비밀번호 확인</label> <input type="password" -->
					<!-- 							class="form-control" placeholder="비밀번호를 다시 입력해주세요" /> -->
					<!-- 					</div> -->
					<div class="mb-3">
						<label for="sample4_postcode" class="form-label">우편번호</label>
						<div class="input-group">
							<input type="text" class="form-control" id="sample4_postcode"
								placeholder="우편번호"> <input type="button"
								class="btn btn-outline-secondary"
								onclick="sample4_execDaumPostcode()" value="우편번호 찾기">
						</div>
					</div>
					<div class="mb-3">
						<label for="sample4_roadAddress" class="form-label">도로명주소</label>
						<input type="text" class="form-control" id="sample4_roadAddress"
							placeholder="도로명주소">
					</div>
					<div class="mb-3">
						<label for="sample4_jibunAddress" class="form-label">지번주소</label>
						<input type="text" class="form-control" id="sample4_jibunAddress"
							placeholder="지번주소"> <span id="guide"
							style="color: #999; display: none"></span>
					</div>
					<div class="mb-3">
						<label for="sample4_detailAddress" class="form-label">상세주소</label>
						<input type="text" class="form-control" id="sample4_detailAddress"
							placeholder="상세주소">
					</div>
					<div class="mb-3">
						<label for="sample4_extraAddress" class="form-label">참고항목</label>
						<input type="text" class="form-control" id="sample4_extraAddress"
							placeholder="참고항목">
					</div>
					<div class="d-flex align-items-center justify-content-between">
						<div class="form-check m-0">
							<input class="form-check-input" type="checkbox" value=""
								id="rememberPassword" /> <label class="form-check-label"
								for="rememberPassword">이용약관에 동의합니다</label>
						</div>
					</div>
					<div class="d-grid py-3">
						<button type="button" class="btn btn-lg btn-primary"
							id="btnSubmit">회원가입</button>
					</div>
					<div class="text-center py-3">or SignUp with</div>
					<div class="d-flex gap-2 justify-content-center">
						<button type="submit" class="btn btn-outline-light">
							<img src="/xdm/v1/images/google.svg" class="login-icon"

						</button>
						<button type="submit" class="btn btn-outline-light">
							<img src="/xdm/v1/images/facebook.svg" class="login-icon"
								alt="Login with Facebook" />
						</button>
					</div>

							href="/xdm/v1/infra/member/membersigninXdmForm"
							class="text-blue text-decoration-underline ms-2">로그인하세요</a>
					</div>

<script>
	document.getElementById("btnSubmit").onclick = function() {
				alert(document.getElementById("ifcgName").value);	 

		var memberId = document.getElementById("memberId");
		var memberIdValue = document.getElementById("memberId").value.trim();
		var memberIdRegExp = /^[A-Za-z0-9]{4,12}$/;

		if (memberIdValue == "" || memberIdValue == null) {
						alert("아이디를 입력해 주세요");
			memberId.classList.add("field-error"); 
			memberId.focus();
			return false;
		} else {
			memberId.classList.remove("field-error"); 
			// 			by pass
		}

		if (!memberIdRegExp.test(memberIdValue)) {
						alert("아이디는 4자 이상 12자 이하의 영대소문자, 숫자만 허용합니다");
			memberId.classList.add("field-error"); 
			memberId.focus();
			return false;
		} else {
			memberId.classList.remove("field-error"); 
			// 	    	by pass
		}

		var memberPw = document.getElementById("memberPw");
		var memberPwValue = document.getElementById("memberPw").value.trim();
		var memberPwRegExp = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*()])[a-zA-Z\d!@#$%^&*()]{8,12}$/;

		if (memberPwValue == "" || memberPwValue == null) {
						alert("비밀번호를 입력해주세요");
			memberPw.classList.add("field-error"); 
			memberPw.focus();
			return false;
		} else {
			memberPw.classList.add("field-error"); 
			// 			by pass
		}

		if (!memberPwRegExp.test(memberPwValue)) {
			alert("비밀번호는 영문, 숫자, 특수문자의 조합으로 이루어진 8자 이상 12자 이하만 허용합니다");
			memberPw.classList.add("field-error");
			memberPw.focus();
			return false;
		} else {
			memberPw.classList.remove("field-error"); 
			// 	    	by pass
		}
		// -----------------------------------------------------------------
		// 비밀번호 확인 로직: 제출 버튼 클릭 시 확인
		var memberPwConfirm = document
				.querySelector('input[placeholder="비밀번호를 다시 입력해주세요"]');
				var memberPwConfirmValue = memberPwConfirm.value.trim();

		if (memberPwConfirmValue === "") {
			alert("비밀번호를 다시 입력해 주세요.");
			memberPwConfirm.classList.add("field-error");
			memberPwConfirm.focus();
			return false;
		}

		if (memberPwValue !== memberPwConfirmValue) {
			alert("비밀번호가 일치하지 않습니다. 다시 확인해주세요.");
			memberPwConfirm.classList.add("field-error");
			memberPwConfirm.focus();
			return false;
		} else {
			memberPwConfirm.classList.remove("field-error");
		}
		//-------------------------------------------------------------------
		// 우편번호와 참고항목 검사
		var postcode = document.getElementById("sample4_postcode");
		var extraAddress = document.getElementById("sample4_extraAddress");

		if (!postcode.value.trim()) {
			alert("우편번호를 입력해 주세요.");
			postcode.classList.add("field-error");
			postcode.focus();
			return false;
		} else {
			postcode.classList.remove("field-error");
		}

		if (!extraAddress.value.trim()) {
			alert("참고항목을 입력해 주세요.");
			extraAddress.classList.add("field-error");
			extraAddress.focus();
			return false;
		} else {
			extraAddress.classList.remove("field-error");
		}

		// 상세주소 검사
		var detailAddress = document.getElementById("sample4_detailAddress");

		if (!detailAddress.value.trim()) {
			alert("상세주소를 입력해 주세요.");
			detailAddress.classList.add("field-error");
			detailAddress.focus();
			return false;
		} else {
			detailAddress.classList.remove("field-error");
		}
		//-------------------------------------------------------------------
		// jQuery 형태로 작성된 AJAX 요청
					$.ajax({
					async : true, // 비동기 요청으로 설정
					cache : false, // 캐시 사용 안 함
					type : "post", // HTTP 요청 방식: POST
					dataType: "json",

					url : "/xdm/v1/infra/member/membersignupProc", 

					data: $("#formLogin").serialize(), 
					data : {
						"memberId" : $("#memberId").val(), 
						"memberPw" : $("#memberPw").val(), 
						"autoLogin" : $("#autoLogin").is(":checked")
					},

					success : function(response) {
						if (response.rt == "success") {
							if (response.changePwd == "true") {
								location.href = "/xdm/v1/infra/member/membersigninXdmForm";
							} else {
								location.href = "/xdm/v1/infra/member/membersignupXdmForm";
							}

							location.href = "/xdm/v1/infra/member/memberXdmForm";
						} else {
							document.getElementById("modalAlertTitle").innerText = "확인";
							document.getElementById("modalAlertBody").innerText = "일치하는 회원이 존재 하지 않습니다!";
							$("#modalAlert").modal("show");
						}
					},

					error : function(jqXHR, textStatus, errorThrown) {
						console.error("AJAX 요청 오류:", textStatus, errorThrown);
						alert("ajaxUpdate " + jqXHR.textStatus + " : "
								+ jqXHR.errorThrown);
					}
				});

		form.action = "/xdm/v1/infra/member/membersignupXdmForm";
		form.submit();
	}
</script>
<!-- kakao 주소 -->
<script
	src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
	//본 예제에서는 도로명 주소 표기 방식에 대한 법령에 따라, 내려오는 데이터를 조합하여 올바른 주소를 구성하는 방법을 설명합니다.
	function sample4_execDaumPostcode() {
		new daum.Postcode(
				{
					oncomplete : function(data) {
						// 팝업에서 검색결과 항목을 클릭했을때 실행할 코드를 작성하는 부분.

						// 도로명 주소의 노출 규칙에 따라 주소를 표시한다.
						// 내려오는 변수가 값이 없는 경우엔 공백('')값을 가지므로, 이를 참고하여 분기 한다.
						var roadAddr = data.roadAddress; // 도로명 주소 변수
						var extraRoadAddr = ''; // 참고 항목 변수

						// 법정동명이 있을 경우 추가한다. (법정리는 제외)
						// 법정동의 경우 마지막 문자가 "동/로/가"로 끝난다.
						if (data.bname !== '' && /[동|로|가]$/g.test(data.bname)) {
							extraRoadAddr += data.bname;
						}
						// 건물명이 있고, 공동주택일 경우 추가한다.
						if (data.buildingName !== '' && data.apartment === 'Y') {
							extraRoadAddr += (extraRoadAddr !== '' ? ', '
									+ data.buildingName : data.buildingName);
						}
						// 표시할 참고항목이 있을 경우, 괄호까지 추가한 최종 문자열을 만든다.
						if (extraRoadAddr !== '') {
							extraRoadAddr = ' (' + extraRoadAddr + ')';
						}

						// 우편번호와 주소 정보를 해당 필드에 넣는다.
						document.getElementById('sample4_postcode').value = data.zonecode;
						document.getElementById("sample4_roadAddress").value = roadAddr;
						document.getElementById("sample4_jibunAddress").value = data.jibunAddress;

						// 참고항목 문자열이 있을 경우 해당 필드에 넣는다.
						if (roadAddr !== '') {
							document.getElementById("sample4_extraAddress").value = extraRoadAddr;
						} else {
							document.getElementById("sample4_extraAddress").value = '';
						}

						var guideTextBox = document.getElementById("guide");
						// 사용자가 '선택 안함'을 클릭한 경우, 예상 주소라는 표시를 해준다.
						if (data.autoRoadAddress) {
							var expRoadAddr = data.autoRoadAddress
									+ extraRoadAddr;
							guideTextBox.innerHTML = '(예상 도로명 주소 : '
									+ expRoadAddr + ')';
							guideTextBox.style.display = 'block';

						} else if (data.autoJibunAddress) {
							var expJibunAddr = data.autoJibunAddress;
							guideTextBox.innerHTML = '(예상 지번 주소 : '
									+ expJibunAddr + ')';
							guideTextBox.style.display = 'block';
						} else {
							guideTextBox.innerHTML = '';
							guideTextBox.style.display = 'none';
						}
					}
				}).open();
	}
</script>
